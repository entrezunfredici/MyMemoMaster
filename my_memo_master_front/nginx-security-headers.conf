# En-têtes de sécurité HTTP du front (OWASP A05 — mauvaise configuration de sécurité).
# Inclus dans CHAQUE `location` de nginx.conf : en nginx, un `add_header` posé dans un bloc `location`
# annule tous ceux hérités du niveau serveur — les déclarer une seule fois au niveau serveur ne
# protégerait donc aucune réponse. `always` : l'en-tête est aussi envoyé sur les 404/500.
#
# CSP — choix assumés :
#  - script-src 'self' : le build Vite n'émet que des scripts externes (aucun script inline) ; pas de
#    'unsafe-inline' ni de 'unsafe-eval' côté scripts, c'est la partie qui bloque l'exécution de XSS.
#  - style-src 'self' 'unsafe-inline' : Vue/MathLive posent des attributs style="" ; le risque d'une
#    injection de style est sans commune mesure avec celui d'un script.
#  - connect-src 'self' https: wss: + localhost : l'URL de l'API est configurée à l'exécution
#    (window.__APP_CONFIG__) et change d'un environnement à l'autre : on ne peut pas la figer ici.
#    Seuls les appels chiffrés sont autorisés hors poste de développement.
#  - img-src … https: blob: data: : aperçus d'images (blob:), miniatures encodées (data:), images
#    téléversées servies par l'API (autre origine).
#  - frame-ancestors 'none' + X-Frame-Options DENY : anti-clickjacking (l'application n'est jamais
#    intégrée dans une iframe). object-src 'none', base-uri 'self', form-action 'self'.
#  - worker-src 'self' : service worker de la PWA.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://localhost; font-src 'self' data:; connect-src 'self' https: wss: http://localhost:* ws://localhost:*; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# HSTS : ignoré par les navigateurs en HTTP simple (poste de dev), appliqué dès qu'une réponse HTTPS le porte.
add_header Strict-Transport-Security "max-age=31536000" always;
