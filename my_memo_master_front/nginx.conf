server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Ne pas annoncer la version de nginx (en-tête Server, pages d'erreur) — OWASP A05.
    server_tokens off;

    # Cache long pour les bundles hashés
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback + index non mis en cache (évite les bundles 404)
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
