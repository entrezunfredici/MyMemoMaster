# =============================================================================
#  PostgreSQL dédié à SonarQube — instance distincte de celle de l'application.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sq.postgresService" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sq.labels" . | nindent 4 }}
    app: {{ include "sq.postgresService" . }}
spec:
  serviceName: {{ include "sq.postgresService" . }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "sq.postgresService" . }}
  template:
    metadata:
      labels:
        app: {{ include "sq.postgresService" . }}
    spec:
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            # Sous-répertoire imposé : le point de montage d'un volume Cinder
            # contient un lost+found, et initdb refuse un répertoire non vide.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "sq.secretName" . }}
                  key: PG_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sq.secretName" . }}
                  key: PG_PASS
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "sq.configName" . }}
                  key: PG_DB
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storageClass }}
        storageClassName: {{ .Values.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
