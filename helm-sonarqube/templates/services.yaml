# ── PostgreSQL (dédié SonarQube) ──────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sq.postgresService" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "sq.postgresService" . }}
  ports:
    - port: 5432
      targetPort: 5432

---

# ── SonarQube ─────────────────────────────────────────────────────────────────
# ClusterIP volontairement : pas d'Ingress, accès par port-forward uniquement.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 9000
