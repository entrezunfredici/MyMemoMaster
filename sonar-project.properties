# Configuration du scanner Sonar.
# Cible : instance SonarQube Community auto-hébergée (chart helm-sonarqube/),
# analysée par le job `sonarqube` de .github/workflows/ci.yml.
#
# projectKey : identifiant du projet DANS l'instance. La valeur ci-dessous est
# héritée de SonarCloud et conservée telle quelle pour ne pas casser un éventuel
# retour en arrière — créer le projet avec cette clé exacte dans l'instance.
sonar.projectKey=entrezunfredici_MyMemoMaster
# sonar.organization n'a de sens que sur SonarCloud (notion absente d'une
# instance auto-hébergée). Conservée en commentaire pour un retour en arrière.
# sonar.organization=entrezunfredici
sonar.projectName=MyMemoMaster

# Sources analysées (monorepo : API Express + front Vue)
sonar.sources=my_memo_master_api,my_memo_master_front/src

# Tests (déclarés séparément — un fichier ne doit pas être indexé à la fois en source et en test)
sonar.tests=my_memo_master_api/test,my_memo_master_front/test
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Exclusions : dépendances, builds, couverture, et le dossier test de l'API
# (inclus dans sonar.sources car à la racine de my_memo_master_api)
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,my_memo_master_api/test/**,my_memo_master_api/public/**

# Couverture — rapports lcov produits par le job `test_and_lint` de la CI puis
# transmis au job `sonarqube` par artefact. Les chemins sont prefixes en CI pour
# etre relatifs a la RACINE du depot : Jest et Vitest les ecrivent relatifs a
# leur propre sous-projet, ce que le scanner ne sait pas resoudre.
# Absents en local : SonarQube affiche alors 0 % sans erreur.
sonar.javascript.lcov.reportPaths=my_memo_master_api/coverage/lcov.info,my_memo_master_front/coverage/lcov.info

sonar.sourceEncoding=UTF-8
