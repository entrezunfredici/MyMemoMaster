# =============================================================================
#  values-preprod.yaml — Surcharges environnement preprod
#  Usage : helm upgrade --install mmm-preprod ./helm -f helm/values-preprod.yaml \
#            -n mymemomaster-preprod --create-namespace
# =============================================================================

image:
  api:
    name: mymemomaster_preprod_api
  front:
    name: mymemomaster_preprod_front

replicas:
  api: 1
  front: 1

config:
  # Proxy Cloudflare actif (nuage orange, verifie le 2026-08-26) : 2 sauts
  # devant l'API (Cloudflare + ingress-nginx).
  TRUST_PROXY_HOPS: "2"
  ENVIRONMENT: preprod
  API_PUBLIC_URL: https://preprod-api.my-memo-master.com
  CORS_ORIGIN: https://preprod.my-memo-master.com
  APP_FRONT_URL: https://preprod.my-memo-master.com
  VITE_API_URL: https://preprod-api.my-memo-master.com/api/v1
  VITE_FRONT_URL: https://preprod.my-memo-master.com
  S3_ENDPOINT: https://s3.swiss-backup04.infomaniak.com
  S3_BUCKET: default
  S3_PUBLIC_URL: https://s3.swiss-backup04.infomaniak.com

domain:
  api: preprod-api.my-memo-master.com
  front: preprod.my-memo-master.com
  pgadmin: preprod-pgadmin.my-memo-master.com

# Données jetables : le volume Cinder est supprimé avec le PVC, pas de volume
# orphelin facturé après un `helm uninstall` de la preprod.
storageClass: csi-cinder-sc-delete

# Priorité basse : la preprod cède la place à la prod sous pression.
priorityClassName: mmm-preprod

# Somme des limites en régime établi : 1,95 vCPU / 3,625 Gi (API repassée de 1 à
# 1,5 Gi le 2026-09-01, mesure réelle du modèle sémantique — voir api.resources
# ci-dessous). Le plafond doit laisser en plus la place d'un pod de surge pendant
# un rolling update — le plus gros est toujours l'API (1,5 Gi) : 3,625 + 1,5 =
# 5,125 Gi. 4 Gi ne suffisait déjà pas avant cette hausse et bloquait tout
# redéploiement ; 6 Gi laisse encore ~0,9 Gi de marge (contre ~1,8 Gi avant la
# hausse de l'API — à surveiller si un autre composant grossit à son tour).
resourceQuota:
  enabled: true
  requests:
    cpu: "2"
    memory: 3Gi
  limits:
    cpu: "4"
    memory: 6Gi

postgres:
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Deployment sans PVC — pertes de cache acceptables en preprod
redis:
  persistent: false
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

api:
  resources:
    requests:
      cpu: 100m
      # Mesure réelle faite le 2026-09-01 (`docker stats`, conteneur local) :
      # ~795-825 Mi de RSS avec paraphrase-multilingual-MiniLM-L12-v2 chargé en
      # mémoire (Semantic.service.js) — le chiffre de ~800Mi qui justifiait
      # l'ancienne valeur (mesuré sur all-mpnet-base-v2) était donc le bon
      # ordre de grandeur malgré le changement de modèle : l'estimation de
      # ~120 Mo pour MiniLM sous-évaluait largement l'empreinte réelle du
      # runtime ONNX WASM une fois chargé (poids sur disque ≠ RSS process).
      # Voir DECISIONS.md 2026-09-01 pour le détail et le correctif de
      # pré-chauffage qui a permis d'obtenir cette mesure (il ne chargeait en
      # fait jamais le modèle avant ce jour).
      memory: 896Mi
    limits:
      cpu: 500m
      # ~700 Mi de marge au-dessus de la mesure au repos. Vérifié compatible
      # avec le resourceQuota namespace ci-dessus (§ commentaire) : nouvelle
      # somme en régime établi 3,625 Gi + 1,5 Gi de surge (rolling update) =
      # 5,125 Gi, sous les 6 Gi de plafond (marge réduite à ~0,9 Gi contre
      # ~1,8 Gi avant, mais toujours confortable).
      memory: 1536Mi

front:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 256Mi

# PgAdmin activé en preprod pour faciliter l'administration
pgadmin:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Prometheus sans PVC — perte de l'historique acceptable en preprod
monitoring:
  enabled: true
  persistent: false
  retention: 7d
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
