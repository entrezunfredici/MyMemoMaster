# =============================================================================
#  values-preprod.yaml — Surcharges environnement preprod
#  Usage : helm upgrade --install mmm-preprod ./helm -f helm/values-preprod.yaml \
#            -n mymemomaster-preprod --create-namespace
# =============================================================================

image:
  api:
    name: mymemomaster_preprod_api
  front:
    name: mymemomaster_preprod_front

replicas:
  api: 1
  front: 1

config:
  # Proxy Cloudflare actif (nuage orange, verifie le 2026-08-26) : 2 sauts
  # devant l'API (Cloudflare + ingress-nginx).
  TRUST_PROXY_HOPS: "2"
  ENVIRONMENT: preprod
  API_PUBLIC_URL: https://preprod-api.my-memo-master.com
  CORS_ORIGIN: https://preprod.my-memo-master.com
  VITE_API_URL: https://preprod-api.my-memo-master.com/api/v1
  VITE_FRONT_URL: https://preprod.my-memo-master.com
  S3_ENDPOINT: https://s3.swiss-backup04.infomaniak.com
  S3_BUCKET: default
  S3_PUBLIC_URL: https://s3.swiss-backup04.infomaniak.com

domain:
  api: preprod-api.my-memo-master.com
  front: preprod.my-memo-master.com
  pgadmin: preprod-pgadmin.my-memo-master.com

# Données jetables : le volume Cinder est supprimé avec le PVC, pas de volume
# orphelin facturé après un `helm uninstall` de la preprod.
storageClass: csi-cinder-sc-delete

# Priorité basse : la preprod cède la place à la prod sous pression.
priorityClassName: mmm-preprod

# Somme des limites en régime établi : 1,95 vCPU / 3,2 Gi. Le plafond doit
# laisser en plus la place d'un pod de surge pendant un rolling update — le plus
# gros est l'API (1 Gi). 4 Gi ne suffisait pas (3,2 + 1 = 4,125 Gi) et bloquait
# tout redéploiement ; 6 Gi laisse la marge sans rendre le garde-fou inopérant.
resourceQuota:
  enabled: true
  requests:
    cpu: "2"
    memory: 3Gi
  limits:
    cpu: "4"
    memory: 6Gi

postgres:
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Deployment sans PVC — pertes de cache acceptables en preprod
redis:
  persistent: false
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

api:
  resources:
    requests:
      cpu: 100m
      # Le modèle sémantique est chargé en mémoire par le pod (Semantic.service.js).
      # NOTE : le chiffre de ~800Mi qui justifiait cette valeur datait du modèle
      # all-mpnet-base-v2, remplacé depuis par paraphrase-multilingual-MiniLM-L12-v2
      # (~120 Mo). Valeur conservative en attendant une mesure réelle via
      # `kubectl top pods` (metrics-server installé le 2026-08-26).
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

front:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 256Mi

# PgAdmin activé en preprod pour faciliter l'administration
pgadmin:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Prometheus sans PVC — perte de l'historique acceptable en preprod
monitoring:
  enabled: true
  persistent: false
  retention: 7d
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
