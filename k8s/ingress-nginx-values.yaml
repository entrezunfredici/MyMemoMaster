# =============================================================================
#  Valeurs du contrôleur ingress-nginx (chart ingress-nginx/ingress-nginx)
#
#  Installation / mise à jour :
#    helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
#      -n ingress-nginx --create-namespace -f k8s/ingress-nginx-values.yaml
# =============================================================================
controller:
  # Un pod par nœud : la perte d'un nœud ne coupe pas l'entrée du trafic.
  replicaCount: 2

  service:
    # Local (et non Cluster) : préserve l'IP source réelle du client. En Cluster,
    # kube-proxy fait du SNAT et nginx ne voit que l'IP du nœud — les plages
    # Cloudflare de proxy-real-ip-cidr ne matcheraient jamais.
    externalTrafficPolicy: Local

  config:
    # N'accepte X-Forwarded-For QUE s'il provient d'une plage Cloudflare.
    # Une requête arrivant en direct sur l'origine ne peut donc pas falsifier
    # son IP, même avant la mise en place du filtrage par security group.
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    proxy-real-ip-cidr: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
